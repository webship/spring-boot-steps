name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cucumber:
    # Three apps, each built in a DDEV project on the runner with its own Maven wrapper on the current
    # long-term-support JDK, and run as a production jar:
    #   - petclinic: the PetClinic sample at the current Spring Boot release with Spring Security added by the
    #     build (tests/features), then the assertions that must fail (tests/must-fail);
    #   - new-app: a new app made with Spring Initializr, with Spring Security added: no page and no error page
    #     of its own (tests/new-app);
    #   - without-security: the sample as it is, at its own Spring Boot release, with no login
    #     (tests/without-security).
    name: spring-boot-steps test suite (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: petclinic
            app: petclinic
            security: 'on'
            boot: '4.2.0'
            features: tests/features
            must_fail: true
          - lane: new-app
            app: new
            security: 'on'
            boot: '4.2.0'
            features: tests/new-app
            must_fail: false
          - lane: without-security
            app: petclinic
            security: 'off'
            boot: ''
            features: tests/without-security
            must_fail: false
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      SITE_DIR: ${{ github.workspace }}/../spring-boot-site
      APP: ${{ matrix.app }}
      SECURITY: ${{ matrix.security }}
      SPRING_BOOT_VERSION: ${{ matrix.boot }}
      FEATURES: ${{ matrix.features }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      # Maven keeps the app's libraries in the project (.m2/); a build in the same folder reuses them.
      - name: Restore the Maven downloads of an earlier run
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../spring-boot-site/.m2
          key: m2-${{ matrix.lane }}-${{ hashFiles('.github/scripts/build-ddev-site.sh', 'site/prepare-app.py') }}
          restore-keys: |
            m2-${{ matrix.lane }}-

      - name: Build the test site (the app, Spring Security, the accounts)
        run: .github/scripts/build-ddev-site.sh

      - name: Check the site is the one cucumber.js runs against by default
        run: |
          DEFAULT_URL="$(LAUNCH_URL= node -e "console.log(require('./cucumber.js').default.worldParameters.launchUrl)")"
          echo "Built: $LAUNCH_URL, default: $DEFAULT_URL"
          test "${LAUNCH_URL%/}" = "$DEFAULT_URL"

      - name: Run the test suite
        run: npx cucumber-js

      - name: Run the test suite again (it leaves the site as it found it)
        run: npx cucumber-js

      - name: Run the assertions that must fail
        if: matrix.must_fail
        env:
          FEATURES: ''
        run: npm run test:must-fail

      - name: Show the log of the app
        if: failure()
        run: |
          cd "$SITE_DIR"
          ddev logs --tail 200 < /dev/null || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.lane }}
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.lane }}
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
